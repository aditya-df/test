services:
  knowgenai:
    build:
      context: ../../
      dockerfile: docker/trialam/Dockerfile
    image: us-central1-docker.pkg.dev/PROJECT_ID/knowgen-v2/knowgenai-web
    restart: always
    ports:
      - "3001:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NEXTAUTH_URL=https://REPLACE_DOMAIN
      - NEXTAUTH_URL_INTERNAL=http://localhost:3000